<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZenTask | Smart Task Manager</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

<div class="container">

    <!-- LEFT SECTION -->
    <div class="left">

        <div class="logo">
            ✨ ZenTask
        </div>

        <h1>
            Manage Your Tasks <br>
            With Simplicity & Style
        </h1>

        <p class="subtitle">
            Boost your productivity with a clean and modern task management experience.
        </p>

        <div class="buttons">

            <a href="login.html" class="btn login-btn">
                Login
            </a>

            <a href="register.html" class="btn register-btn">
                Register
            </a>

        </div>

    </div>

    <!-- RIGHT SECTION -->
    <div class="right">

        <div class="glass-card">

            <h2>Today's Progress</h2>

            <!-- PROGRESS -->
            <div class="progress-box">
                <div class="progress"></div>
            </div>

            <p class="progress-text">
                75% Tasks Completed
            </p>

            <!-- TASKS -->
            <div class="task-card">
                <span>✔ Complete UI Design</span>
            </div>

            <div class="task-card">
                <span>✔ Connect Backend API</span>
            </div>

            <div class="task-card pending">
                <span>⏳ Deploy Project</span>
            </div>

        </div>

    </div>

</div>

</body>
</html>
